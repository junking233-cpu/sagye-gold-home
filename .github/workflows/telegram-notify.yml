name: 텔레그램 가격 알림

# 🔴 손으로만 돌립니다 (Actions → 텔레그램 가격 알림 → Run workflow).
#    사계절 시세는 장부 「손님 시세」 사계절 탭에서 바꾸고, 그때마다 장부가 알림 방에 한 줄을 보냅니다.
#    카드 그림이 필요할 때만 이 워크플로를 돌리면 홈페이지 https://www.sagyegold.co.kr/prices.json (장부 값)을 읽어 카드를 보냅니다.
# 🔴 어떤 워크플로도 prices.js · prices.json 을 저장소에 커밋하지 마세요 — 정적 파일이 장부 값을 가립니다.
on:
  workflow_dispatch:

jobs:
  send-card:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Pillow 설치
        run: pip install Pillow

      - name: 카드 생성 + 텔레그램 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
